name: Package BarsGalore Addon

on:
  release:
    types: [published]
  # Optional: allow manual runs
  workflow_dispatch:

permissions:
  contents: write   # required to create/update releases and upload assets

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP (with addons folder at root)
        run: |
          zip -r BarsGalore-addon.zip addons

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BarsGalore-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}